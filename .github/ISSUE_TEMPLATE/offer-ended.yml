name: Offer ended or changed
description: Report an offer that no longer works or has different terms.
title: "Ended/changed: "
labels: ["outdated"]
body:
  - type: input
    id: name
    attributes:
      label: Which offer?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What changed?
      description: Link to the source if you can (official announcement, changelog, or the page now saying it's over).
    validations:
      required: true
