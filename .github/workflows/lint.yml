name: Awesome lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # awesome-lint finds the repo through the current branch's remote. Pull
      # requests are checked out on a detached HEAD, and its fallback for that
      # case breaks on newer git, so always give it a named branch on origin.
      - name: Put HEAD on a branch that tracks origin (awesome-lint reads it)
        run: |
          branch="$(git branch --show-current)"
          if [ -z "$branch" ]; then
            branch=lint-check
            git checkout -q -B "$branch"
          fi
          git config "branch.$branch.remote" origin
      - name: Run awesome-lint
        run: |
          npx --yes awesome-lint 2>&1 | tee lint.txt || true
          # The "repo must be 30 days old" rule only matters when submitting to
          # sindresorhus/awesome, so it doesn't fail the build. Everything else does.
          if grep '✖' lint.txt | grep -v 'days old'; then
            echo "::error::awesome-lint found problems (see above)"
            exit 1
          fi
