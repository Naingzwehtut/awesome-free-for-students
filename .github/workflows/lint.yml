name: Awesome lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Point the branch at origin (awesome-lint reads it)
        run: git config "branch.$(git branch --show-current || echo main).remote" origin || true
      - name: Run awesome-lint
        run: |
          npx --yes awesome-lint 2>&1 | tee lint.txt || true
          # The "repo must be 30 days old" rule only matters when submitting to
          # sindresorhus/awesome, so it doesn't fail the build. Everything else does.
          if grep '✖' lint.txt | grep -v 'days old'; then
            echo "::error::awesome-lint found problems (see above)"
            exit 1
          fi
